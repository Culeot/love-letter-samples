<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>复古胶片 · 宝丽来 · 样品</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Courier+Prime&family=Shadows+Into+Light&display=swap" rel="stylesheet">
<style>
:root{--ink:#3c2e1e;--brown:#8b5a2b;--tan:#e8dcc8;--cream:#f5ede0;--sepia:#c4956a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;touch-action:none;font-family:'Courier Prime',monospace;background:#2c2418;color:var(--ink)}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;transition:opacity 1.1s ease;overflow:hidden}
.scene.active{opacity:1;visibility:visible;pointer-events:all}
/* 胶片底 */
.film{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,#f0e6d4,#e3d3b8 60%,#d4c09e);}
.film::after{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg width='180' height='180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.06'/%3E%3C/svg%3E")}
/* 宝丽来相框 */
.polaroid{position:absolute;z-index:3;background:#fff;padding:10px 10px 30px;box-shadow:0 6px 22px rgba(0,0,0,.3),0 0 0 1px rgba(0,0,0,.08);transform:rotate(-2.5deg)}
.polaroid.r{transform:rotate(2deg)}
.polaroid .pic{width:100%;aspect-ratio:1/0.8;object-fit:cover;filter:sepia(.25) contrast(.95) brightness(1.02)}
.polaroid .cap{font-family:'Shadows Into Light',cursive;font-size:1rem;color:var(--brown);text-align:center;margin-top:8px}
/* 胶带 */
.tape{position:absolute;width:56px;height:16px;background:rgba(201,169,110,.6);transform:rotate(-4deg);z-index:4;box-shadow:0 1px 3px rgba(0,0,0,.2)}
/* 日期戳 */
.datestamp{position:absolute;z-index:3;font-family:'Courier Prime',monospace;font-size:.7rem;color:rgba(60,46,30,.65);letter-spacing:1px;transform:rotate(-2deg)}
.art{position:absolute;z-index:4;top:16%;left:0;right:0;text-align:center;padding:0 26px}
.title{font-family:'Caveat',cursive;font-size:clamp(2.4rem,10vw,3.6rem);color:var(--ink);margin-bottom:6px}
.sub{font-family:'Courier Prime',monospace;font-size:clamp(.65rem,2.4vw,.85rem);letter-spacing:4px;color:rgba(60,46,30,.65);margin-bottom:6px}
.body{font-size:clamp(.92rem,3vw,1.05rem);line-height:2.1;color:rgba(60,46,30,.88);max-width:560px;margin:16px auto 0;text-align:left}
.sig{font-family:'Shadows Into Light',cursive;font-size:1.4rem;color:var(--brown);text-align:right;max-width:560px;margin:12px auto 0}
.btn{display:inline-block;margin-top:24px;padding:12px 40px;cursor:pointer;font-family:'Courier Prime',monospace;font-size:.85rem;letter-spacing:3px;color:var(--ink);background:transparent;border:1.5px solid var(--brown);box-shadow:0 2px 8px rgba(0,0,0,.1);transition:all .3s}
.btn:hover{background:var(--brown);color:var(--cream)}
.hwrap{position:absolute;z-index:4;bottom:11vh;left:50%;transform:translateX(-50%);width:100%;padding:0 16px;text-align:center}
.ht{font-family:'Caveat',cursive;font-size:2rem;color:var(--ink);margin-bottom:2px}
.hh{font-size:.78rem;color:rgba(60,46,30,.65);letter-spacing:2px;margin-bottom:10px}
.cf{position:relative;width:min(320px,84vw);height:min(240px,62vw);margin:0 auto 8px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.6);box-shadow:0 4px 16px rgba(0,0,0,.18);border:1px solid rgba(139,90,43,.3)}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.cov{position:absolute;inset:0;z-index:5;background:rgba(245,237,224,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;opacity:0;pointer-events:none;transition:opacity .6s}
.cov.v{opacity:1;pointer-events:auto}
.cb{padding:10px 34px;cursor:pointer;font-size:.85rem;letter-spacing:3px;color:var(--ink);background:transparent;border:1.5px solid var(--brown)}
.hc{display:flex;justify-content:center;align-items:center;gap:14px;font-size:.82rem;color:var(--ink)}
.rb{padding:7px 20px;cursor:pointer;font-size:.76rem;color:var(--ink);background:rgba(255,255,255,.7);border:1px solid rgba(139,90,43,.4)}
.next{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);z-index:60;padding:10px 38px;cursor:pointer;font-family:'Courier Prime',monospace;font-size:.8rem;letter-spacing:3px;color:var(--ink);background:rgba(245,237,224,.85);border:1px solid rgba(139,90,43,.4);box-shadow:0 2px 8px rgba(0,0,0,.15);transition:all .3s}
.next:hover{background:var(--brown);color:var(--cream)}
.next.h{opacity:0;pointer-events:none}
.dots{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:6px;padding:4px 10px;border-radius:10px;background:rgba(245,237,224,.8)}
.pt{width:5px;height:5px;border-radius:50%;background:rgba(60,46,30,.35);cursor:pointer;transition:all .3s}
.pt.a{background:var(--brown);width:16px}
</style>
</head>
<body>
<div id="scenes">
<div class="scene active" id="s0">
    <div class="film"></div>
    <div class="polaroid" style="width:min(210px,52vw);top:8%;left:6%"><div class="pic" style="background:linear-gradient(135deg,#c9a97e,#8b6b45)"></div><div class="cap">est. 2024</div></div>
    <div class="polaroid r" style="width:min(180px,44vw);bottom:10%;right:7%"><div class="pic" style="background:linear-gradient(135deg,#a97e5a,#6b4a2e)"></div><div class="cap">us ♡</div></div>
    <div class="tape" style="top:6%;right:22%"></div>
    <div class="datestamp" style="top:12%;left:38%">AUG 2026</div>
    <div class="art">
        <div class="title">Dear You</div>
        <div class="sub">A LETTER IN FILM</div>
        <button class="btn" onclick="go(1)">DEVELOP ❦</button>
    </div>
</div>
<div class="scene" id="s1">
    <div class="film"></div>
    <div class="polaroid" style="width:min(200px,50vw);top:10%;right:7%"><div class="pic" style="background:linear-gradient(135deg,#b8a07e,#8a6b4a)"></div><div class="cap">sunlight</div></div>
    <div class="tape" style="bottom:16%;left:20%"></div>
    <div class="art">
        <div class="title">第一帧</div>
        <div class="body">按下快门的那一刻,时间停驻。你回眸的笑,被永远定格在胶片的颗粒里。后来的每一次冲洗,都是一次重温初见。</div>
        <div class="sig">— 第一卷底片</div>
    </div>
</div>
<div class="scene" id="s2">
    <div class="film"></div>
    <div class="polaroid r" style="width:min(200px,50vw);bottom:12%;left:8%"><div class="pic" style="background:linear-gradient(135deg,#c9b89a,#967a55)"></div><div class="cap">together</div></div>
    <div class="datestamp" style="top:14%;right:30%">12.22.2024</div>
    <div class="art">
        <div class="title">冲印</div>
        <div class="body">时光像一盒未冲洗的胶卷,每一帧都是我们的故事。有模糊的日常,有曝光过度的欢喜,也有恰到好处的温暖。</div>
        <div class="sig">— 显影液里的温度</div>
    </div>
</div>
<div class="scene" id="s3">
    <div class="film"></div>
    <div class="hwrap">
        <div class="ht">画心</div>
        <div class="hh">沿焦糖色轨道,描摹心跳的瞬间</div>
        <div class="cf"><canvas id="cv"></canvas><div class="cov" id="cov"><div style="font-family:'Caveat';font-size:1.8rem;color:var(--brown)">定格这一刻</div><button class="cb" onclick="go(4)">SHOOT</button></div></div>
        <div class="hc"><span id="pg">0%</span><button class="rb" id="rb">↺ 重拍</button></div>
    </div>
</div>
<div class="scene" id="s4">
    <div class="film"></div>
    <div class="polaroid" style="width:min(210px,52vw);top:12%;left:50%;transform:translateX(-50%) rotate(1.5deg)"><div class="pic" style="background:linear-gradient(135deg,#d4b896,#a5855e)"></div><div class="cap">forever</div></div>
    <div class="art" style="top:56%">
        <div class="title">永不褪色</div>
        <div class="body">胶片会泛黄,但这一刻的我们,永远鲜活。</div>
    </div>
</div>
</div>
<div class="dots" id="dots"></div>
<button class="next" id="next" onclick="go(cur+1)">NEXT ❦</button>
<script>
const N=5;let cur=0;
function go(i){if(i<0||i>=N)return;cur=i;for(let k=0;k<N;k++)document.getElementById('s'+k).classList.toggle('active',k===i);document.querySelectorAll('.pt').forEach((d,k)=>d.classList.toggle('a',k===i));document.getElementById('next').classList.toggle('h',i===0||i===3||i>=N-1);if(i===3)setTimeout(()=>window.HM&&HM.reset(),350)}
const dd=document.getElementById('dots');for(let i=0;i<N;i++){const d=document.createElement('div');d.className='pt'+(i===0?' a':'');d.onclick=()=>go(i);dd.appendChild(d)}
(function(){'use strict';const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=320,H=240,CX=W/2,CY=H/2-2,OY=5.5,SO=5.0,SM=3.7,SI=2.4,HIT=14,STEP=4,SAM=150,DEN=2000,WT=[.4,.35,.25],UL=.5,CP=.85;const dpr=Math.min(devicePixelRatio||1,3);cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);function hx(t){return 16*Math.pow(Math.sin(t),3)}function hy(t){return 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)}function tc(t,s){return{x:CX+hx(t)*s,y:CY-(hy(t)+OY)*s}}function gen(n,s){const d=[];for(let i=0;i<=DEN;i++){const t=i/DEN*Math.PI*2;d.push({t,x:hx(t),y:hy(t)})}const c=[0];for(let i=1;i<=DEN;i++){const dx=d[i].x-d[i-1].x,dy=d[i].y-d[i-1].y;c.push(c[i-1]+Math.sqrt(dx*dx+dy*dy))}const tot=c[DEN],o=[];for(let i=0;i<n;i++){const tg=i/n*tot;let lo=0,hi=DEN;while(lo<hi){const m=(lo+hi)>>1;if(c[m]<tg)lo=m+1;else hi=m}const p=tc(d[Math.min(lo,DEN)].t,s);o.push({x:p.x,y:p.y,hit:false})}return o}const L=[gen(SAM,SO),gen(SAM,SM),gen(SAM,SI)],hc=[0,0,0],ac=[true,false,false];let st=[],dw=false,last=null,pg=0,done=false,fill=0,pt=[];function calc(){let t=0;for(let i=0;i<3;i++)if(ac[i])t+=WT[i]*(hc[i]/L[i].length);return Math.min(1,t)}function proc(x,y){if(done)return;const ts=HIT*HIT;for(let l=0;l<3;l++){if(!ac[l])continue;for(let i=0;i<L[l].length;i++){if(L[l][i].hit)continue;const dx=L[l][i].x-x,dy=L[l][i].y-y;if(dx*dx+dy*dy<=ts){L[l][i].hit=true;hc[l]++}}}pg=calc();const r0=hc[0]/L[0].length,r1=hc[1]/L[1].length;if(r0>=UL&&!ac[1])ac[1]=true;if(r1>=UL&&!ac[2])ac[2]=true;if(!done&&pg>=CP){done=true}}function seg(x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,ds=Math.sqrt(dx*dx+dy*dy),n=Math.max(1,Math.floor(ds/STEP));for(let i=1;i<=n;i++){const t=i/n;proc(x1+dx*t,y1+dy*t);st.push({x:x1+dx*t,y:y1+dy*t,a:1})}}function add(x,y){if(last)seg(last.x,last.y,x,y);else{proc(x,y);st.push({x,y,a:1})}last={x,y};if(st.length>600)st.splice(0,st.length-600)}function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}function tpos(e){const r=cv.getBoundingClientRect();return{x:(e.touches[0].clientX-r.left)*W/r.width,y:(e.touches[0].clientY-r.top)*H/r.height}}cv.addEventListener('mousedown',e=>{e.preventDefault();dw=true;last=null;const p=pos(e);add(p.x,p.y)});window.addEventListener('mousemove',e=>{if(dw){const p=pos(e);add(p.x,p.y)}});window.addEventListener('mouseup',()=>{dw=false;last=null});cv.addEventListener('touchstart',e=>{e.preventDefault();dw=true;last=null;const p=tpos(e);add(p.x,p.y)},{passive:false});cv.addEventListener('touchmove',e=>{e.preventDefault();if(dw&&e.touches.length){const p=tpos(e);add(p.x,p.y)}},{passive:false});cv.addEventListener('touchend',e=>{e.preventDefault();dw=false;last=null},{passive:false});function path(s){const p=new Path2D();for(let i=0;i<=200;i++){const t=i/200*Math.PI*2,pt=tc(t,s);if(i===0)p.moveTo(pt.x,pt.y);else p.lineTo(pt.x,pt.y)}p.closePath();return p}function sp(){const t=Math.random()*Math.PI*2,s=SO*(.25+Math.random()*.75),a=Math.random()*Math.PI*2,v=.3+Math.random()*1.6;pt.push({x:CX+hx(t)*s,y:CY-(hy(t)+OY)*s,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,decay:.005+Math.random()*.015,size:.8+Math.random()*2.2,color:['#c4956a','#8b5a2b','#f5ede0'][Math.floor(Math.random()*3)]})}function render(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(240,230,212,.92)');g.addColorStop(.5,'rgba(236,224,204,.9)');g.addColorStop(1,'rgba(230,216,192,.93)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();ctx.lineCap='round';const TC=[{s:SO,g:14,m:6,c:1.4,a:.15,ca:.34},{s:SM,g:10,m:5,c:1.1,a:.12,ca:.27},{s:SI,g:7,m:3.6,c:.9,a:.1,ca:.21}];for(let i=0;i<3;i++){const t=TC[i],p=path(t.s);ctx.strokeStyle='rgba(139,90,43,.08)';ctx.lineWidth=t.g;ctx.stroke(p);ctx.strokeStyle=`rgba(139,90,43,${t.a})`;ctx.lineWidth=t.m;ctx.setLineDash([9,6]);ctx.stroke(p);ctx.setLineDash([]);ctx.strokeStyle=`rgba(196,149,106,${t.ca})`;ctx.lineWidth=t.c;ctx.setLineDash([9,6]);ctx.stroke(p);ctx.setLineDash([])}ctx.restore();for(let i=1;i<st.length;i++){const a=Math.max(0,Math.min(1,st[i].a));if(a<=.01)continue;ctx.beginPath();ctx.moveTo(st[i-1].x,st[i-1].y);ctx.lineTo(st[i].x,st[i].y);ctx.strokeStyle=`rgba(139,90,43,${a})`;ctx.lineWidth=2;ctx.stroke()}if(fill>.01){ctx.save();ctx.globalAlpha=Math.min(1,fill);ctx.fillStyle='rgba(196,149,106,.4)';ctx.fill(path(SO));ctx.restore()}for(const p of pt){ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();ctx.restore()}if(!done){ctx.fillStyle='rgba(60,46,30,.2)';ctx.beginPath();ctx.roundRect((W-170)/2,H-24,170,4,2);ctx.fill();if(pg>.01){ctx.fillStyle='#8b5a2b';ctx.beginPath();ctx.roundRect((W-170)/2,H-24,Math.max(170*pg,3),4,2);ctx.fill()}ctx.fillStyle='rgba(60,46,30,.8)';ctx.font='10px "Courier Prime"';ctx.textAlign='center';ctx.fillText(Math.round(pg*100)+'%',W/2,H-32);document.getElementById('pg').textContent=Math.round(pg*100)+'%'}}function loop(){for(let i=st.length-1;i>=0;i--){st[i].a-=.02;if(st[i].a<=0)st.splice(i,1)}render();if(done){if(fill<1)fill+=.022;if(fill>=.5&&Math.random()<.5)sp();for(let i=pt.length-1;i>=0;i--){const p=pt[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.01;p.vx*=.996;p.vy*=.996;p.life-=p.decay;if(p.life<=0)pt.splice(i,1)}if(fill>=1)document.getElementById('cov').classList.add('v')}requestAnimationFrame(loop)}function reset(){for(let l=0;l<3;l++){for(const p of L[l])p.hit=false;hc[l]=0}ac[0]=true;ac[1]=false;ac[2]=false;st=[];dw=false;last=null;pg=0;done=false;fill=0;pt=[];document.getElementById('cov').classList.remove('v');document.getElementById('pg').textContent='0%'}document.getElementById('rb').onclick=()=>{if(pg>0&&!confirm('确定重拍?'))return;reset()};window.HM={reset};loop()})();
go(0);
</script>
</body>
</html>
