<html lang="zh-CN">
<head>

<title>电子情书 · 12风格样品展示</title>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Great+Vibes&family=Ma+Shan+Zheng&family=Orbitron:wght@700;900&family=Caveat:wght@600&family=Dancing+Script:wght@600&family=Cormorant+Garamond:ital@1&family=Playfair+Display:ital@1&family=Noto+Serif+SC:wght@300;600&family=Noto+Sans+SC:wght@300;500&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;touch-action:none}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .9s ease;overflow:hidden;color:var(--tx);font-family:var(--font-body)}
.scene.active{opacity:1;visibility:visible;pointer-events:all}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:var(--bg-filter)}
.veil{position:absolute;inset:0;background:var(--veil);pointer-events:none}
.art{position:absolute;z-index:4;top:16%;left:0;right:0;text-align:center;padding:0 24px}
.title{font-family:var(--font-title);font-size:var(--title-size);color:var(--accent);text-shadow:var(--title-shadow);line-height:1.2;margin-bottom:8px}
.sub{font-size:clamp(.7rem,2.4vw,.9rem);letter-spacing:5px;color:var(--sub-color);margin-bottom:6px}
.body{font-size:clamp(.95rem,3.2vw,1.1rem);line-height:2.2;color:var(--body-color);max-width:580px;margin:18px auto 0;text-align:left;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.sig{font-family:var(--font-title);font-size:1.6rem;color:var(--accent);text-align:right;max-width:580px;margin:14px auto 0;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.btn{display:inline-block;margin-top:26px;padding:13px 46px;cursor:pointer;font-size:.9rem;letter-spacing:5px;color:var(--accent);background:var(--btn-bg);border:var(--btn-border);transition:all .4s;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.btn:hover{background:var(--accent);color:#fff;transform:translateY(-2px)}
.hwrap{position:absolute;z-index:5;bottom:12vh;left:50%;transform:translateX(-50%);width:100%;padding:0 16px;text-align:center}
.ht{font-family:var(--font-title);font-size:2rem;color:var(--accent);text-shadow:0 2px 6px rgba(0,0,0,.6);margin-bottom:4px}
.hh{font-size:.8rem;color:var(--sub-color);letter-spacing:2px;margin-bottom:10px}
.cf{position:relative;width:min(330px,86vw);height:min(248px,64vw);margin:0 auto 10px;border-radius:10px;overflow:hidden;background:rgba(0,0,0,.25);box-shadow:var(--canvas-shadow)}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.cov{position:absolute;inset:0;z-index:6;background:var(--cov-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;opacity:0;pointer-events:none;transition:opacity .6s}
.cov.v{opacity:1;pointer-events:auto}
/* ==== 裁切小元素(错落如画中物件) ==== */
.cut{position:absolute;z-index:3;pointer-events:none;overflow:hidden;border-radius:3px;
    box-shadow:0 4px 16px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.14),inset 0 0 26px rgba(0,0,0,.22);
    animation:cutFloat 7s ease-in-out infinite}
/* 画框感:双层彩色边+内阴影 */
.cut.frame{box-shadow:0 0 0 3px rgba(0,0,0,.85),0 0 0 4px var(--accent),0 0 0 7px rgba(0,0,0,.85),0 0 0 8px var(--accent),0 8px 28px rgba(0,0,0,.5),inset 0 0 22px rgba(0,0,0,.3)}
.cut.frame::before{content:'';position:absolute;inset:4px;border:1px solid rgba(255,255,255,.2);pointer-events:none}
/* 形状变化 */
.cut.round{border-radius:50%;box-shadow:0 6px 20px rgba(0,0,0,.4),inset 0 0 0 2px rgba(255,255,255,.25),inset 0 0 24px rgba(0,0,0,.2)}
.cut.oval{border-radius:50%/36%;box-shadow:0 6px 20px rgba(0,0,0,.4),inset 0 0 0 1.5px rgba(255,255,255,.22),inset 0 0 22px rgba(0,0,0,.2)}
.cut.wide{border-radius:4px;box-shadow:0 5px 18px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.15),inset 0 0 18px rgba(0,0,0,.18)}
.cut.tall{border-radius:2px;box-shadow:0 5px 18px rgba(0,0,0,.38),inset 0 0 0 1px rgba(255,255,255,.15),inset 0 0 20px rgba(0,0,0,.2)}
@keyframes cutFloat{0%,100%{transform:translateY(0) rotate(var(--rot,0deg))}50%{transform:translateY(-9px) rotate(var(--rot,0deg))}}
.cb{padding:11px 38px;cursor:pointer;font-size:.88rem;letter-spacing:3px;color:var(--accent);background:var(--btn-bg);border:var(--btn-border)}
.hc{display:flex;justify-content:center;align-items:center;gap:14px;font-size:.84rem;color:var(--accent)}
.rb{padding:8px 20px;cursor:pointer;font-size:.76rem;color:var(--accent);background:rgba(255,255,255,.15);border:1px solid var(--accent)}
.next{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);z-index:60;padding:11px 42px;cursor:pointer;font-size:.84rem;letter-spacing:4px;color:var(--accent);background:rgba(0,0,0,.45);border:1px solid var(--accent);backdrop-filter:blur(5px);transition:all .3s}
.next:hover{background:var(--accent);color:#fff}
.next.h{opacity:0;pointer-events:none}
.dots{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:6px;padding:4px 10px;border-radius:10px;background:rgba(0,0,0,.45);backdrop-filter:blur(5px)}
.pt{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer;transition:all .3s}
.pt.a{background:var(--accent);width:16px}
/* 风格切换器 */
.switcher{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;gap:4px;padding:8px 10px;overflow-x:auto;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.12)}
.sw{flex-shrink:0;padding:6px 14px;cursor:pointer;font-size:.72rem;letter-spacing:1px;color:#ccc;background:rgba(255,255,255,.08);border:1px solid transparent;border-radius:16px;transition:all .3s;white-space:nowrap}
.sw:hover{color:#fff;background:rgba(255,255,255,.18)}
.sw.on{color:#000;background:#fff;font-weight:600}
@media(max-width:640px){.art{top:20%}.sw{font-size:.64rem;padding:5px 10px}}
</style>
</head>

<div class="scene" id="s2">

</div>
<div class="scene" id="s3">

    <div class="hwrap">
        <div class="ht">画心 · Draw Your Heart</div>
        <div class="hh">沿轨道描摹,画下你的心</div>
        <div class="cf"><canvas id="cv"></canvas><div class="cov" id="cov"><div style="font-size:1.4rem;font-family:var(--font-title);color:var(--accent)" id="covT">心心相印</div><button class="cb" onclick="go(4)">继续</button></div></div>
        <div class="hc"><span id="pg">0%</span><button class="rb" id="rb">↺ 重描</button></div>
    </div>
</div>
<div class="scene" id="s4">
    <div class="bg" id="bg4"></div><div class="veil"></div>
    <div class="art"><div class="title" id="t4"></div><div class="body" id="b4"></div></div>
</div>
</div>
<div class="dots" id="dots"></div>
<button class="next" id="next" onclick="go(cur+1)">NEXT ❦</button>

        sc.querySelectorAll('.cut').forEach(e=>e.remove());
        if(bases.length<2)return;
        // 当前场景背景图索引:小元素必须排除同源图
        const bgIdx=si%bases.length;
        const others=bases.filter((b,i)=>i!==bgIdx);
        if(!others.length)return;
        // 位置/尺寸/旋转/透明度随机,但保留大小层次与区域分布
        const defs=[
            // 特大背景层(仅正文页):右侧大范围出画
            {sz:[230,290],tag:'a',extra:true,pos:()=>({top:rand(18,36)+'%',right:(-rand(40,80))+'px'}),op:[.22,.35],rot:[-7,7],shape:''},
            // 左上大元素(画框)
            {sz:[130,180],tag:'b',pos:()=>({top:rand(4,13)+'%',left:rand(-25,45)+'px'}),op:[.82,.95],rot:[-15,15],shape:'',frame:true},
            // 右上圆形
            {sz:[95,125],tag:'c',pos:()=>({top:rand(3,15)+'%',right:rand(15,85)+'px'}),op:[.65,.85],rot:[-10,10],shape:'round'},
            // 中部偏右椭圆
            {sz:[120,160],tag:'a',pos:()=>({top:rand(30,46)+'%',right:rand(35,130)+'px'}),op:[.58,.78],rot:[-12,12],shape:'oval'},
            // 左下横条(画框)
            {sz:[150,180],tag:'b',pos:()=>({bottom:rand(7,19)+'%',left:rand(-15,55)+'px'}),op:[.7,.9],rot:[-12,12],shape:'wide',frame:true},
            // 右下竖条
            {sz:[90,130],tag:'c',pos:()=>({bottom:rand(3,13)+'%',right:rand(-15,70)+'px'}),op:[.75,.9],rot:[-12,12],shape:'tall'},
            // 顶部小圆点缀
            {sz:[58,80],tag:'a',pos:()=>({top:rand(2,8)+'%',left:rand(22,52)+'%'}),op:[.85,.95],rot:[-15,15],shape:'round'}
        ].filter(d=>!d.extra||si===1||si===2);
        defs.forEach((d,i)=>{
            const base=others[i%others.length];
            const p=d.pos();
            const w=rand(d.sz[0],d.sz[1]);
            const h=Math.round(w*(1.05+Math.random()*.45));
            const op=d.op[0]+Math.random()*(d.op[1]-d.op[0]);
            const rot=d.rot[0]+Math.random()*(d.rot[1]-d.rot[0]);
            const el=document.createElement('div');
            el.className='cut'+(d.frame?' frame':'')+(d.shape?' '+d.shape:'');
            el.style.backgroundImage=`url('../素材库/图片素材/小元素/${folder}/${base}-${d.tag}.jpg')`;
            el.style.backgroundSize='cover';
            el.style.backgroundPosition='center '+(20+Math.random()*50)+'%';
            el.style.width=w+'px';el.style.height=h+'px';
            el.style.setProperty('--rot',rot+'deg');
            el.style.opacity=op.toFixed(2);
            el.style.zIndex=d.frame?4:3;
            ['top','left','right','bottom'].forEach(k=>{if(p[k]!==undefined)el.style[k]=p[k]});
            sc.appendChild(el);
        });
    });
}
function rand(a,b){return a+Math.round(Math.random()*(b-a))}
// 构建切换器
const sw=document.getElementById('switcher');
Object.keys(THEMES).forEach(name=>{
    const b=document.createElement('div');b.className='sw';b.dataset.name=name;b.textContent=name;
    b.onclick=()=>applyTheme(name);
    sw.appendChild(b);
});
applyTheme('巴洛克');
go(0);
</script>
