<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>巴洛克 · 极繁 · 样品</title>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;1,500&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4af37;--gold-b:#f0d878;--ivory:#f4e9d5;--bg:#1a0f08;--red:#7a1f1f}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;touch-action:none;font-family:'Cormorant Garamond',serif;background:var(--bg);color:var(--ivory)}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;transition:opacity 1.2s ease;overflow:hidden}
.scene.active{opacity:1;visibility:visible;pointer-events:all}
.velvet{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 25%,rgba(122,31,31,.30),transparent 60%),radial-gradient(ellipse at 50% 110%,rgba(212,175,55,.12),transparent 55%),linear-gradient(160deg,#25140a,#1a0f08 45%,#110a05)}
.veil{position:absolute;inset:0;box-shadow:inset 0 0 200px 70px rgba(0,0,0,.85)}
/* 金浮尘 */
.dust{position:fixed;inset:0;pointer-events:none;z-index:50}
.d{position:absolute;width:3px;height:3px;border-radius:50%;background:radial-gradient(circle,#f8e8a0,#d4af37);opacity:0;animation:fl linear infinite}
@keyframes fl{0%{transform:translateY(102vh);opacity:0}8%{opacity:.8}50%{opacity:.4}92%{opacity:.2}100%{transform:translateY(-3vh);opacity:0}}
/* 天使剪影(左) */
.angel{position:absolute;left:-30px;bottom:6vh;width:180px;opacity:.5;filter:drop-shadow(0 4px 14px rgba(0,0,0,.8));z-index:2;animation:floaty 7s ease-in-out infinite}
.angel.r{left:auto;right:-30px;transform:scaleX(-1)}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
/* 卷草纹(右下角) */
.scrollorn{position:absolute;right:-20px;bottom:2vh;width:190px;opacity:.4;z-index:2;filter:drop-shadow(0 3px 10px rgba(0,0,0,.7))}
/* 金框角花 */
.corn{position:absolute;width:52px;z-index:3;filter:drop-shadow(0 2px 6px rgba(0,0,0,.8))}
.corn.tl{top:8px;left:8px}.corn.tr{top:8px;right:8px;transform:scaleX(-1)}.corn.bl{bottom:8px;left:8px;transform:scaleY(-1)}.corn.br{bottom:8px;right:8px;transform:scale(-1,-1)}
/* 内容:题字式,不规则的画面构图 */
.art{position:absolute;z-index:4;top:20%;left:0;right:0;text-align:center;padding:0 24px}
.title{font-family:'Pinyon Script',cursive;font-size:clamp(2.6rem,11vw,4rem);color:var(--gold-b);text-shadow:0 3px 8px rgba(0,0,0,.9),0 0 36px rgba(212,175,55,.4);line-height:1.15}
.sub{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(.8rem,2.8vw,1rem);letter-spacing:5px;color:rgba(244,233,213,.75);margin-top:10px}
.body{font-size:clamp(.95rem,3.2vw,1.1rem);line-height:2.1;color:rgba(244,233,213,.92);max-width:560px;margin:18px auto 0;text-align:left;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.sig{font-family:'Pinyon Script',cursive;font-size:1.7rem;color:var(--gold-b);text-align:right;margin-top:14px;max-width:560px;margin-left:auto;margin-right:auto;text-shadow:0 2px 6px rgba(0,0,0,.85)}
.btn{display:inline-block;margin-top:26px;padding:13px 46px;cursor:pointer;font-family:'Playfair Display',serif;font-size:.9rem;letter-spacing:5px;color:var(--gold-b);background:linear-gradient(180deg,rgba(212,175,55,.16),rgba(212,175,55,.05));border:1px solid rgba(212,175,55,.6);box-shadow:0 0 0 2px rgba(0,0,0,.85),0 0 22px rgba(212,175,55,.22);transition:all .4s}
.btn:hover{background:linear-gradient(180deg,rgba(212,175,55,.34),rgba(212,175,55,.1));box-shadow:0 0 0 2px rgba(0,0,0,.85),0 0 40px rgba(212,175,55,.4)}
/* 画心 */
.hwrap{position:absolute;z-index:4;bottom:12vh;left:50%;transform:translateX(-50%);width:100%;padding:0 16px;text-align:center}
.ht{font-family:'Pinyon Script',cursive;font-size:2rem;color:var(--gold-b);text-shadow:0 2px 6px rgba(0,0,0,.85);margin-bottom:4px}
.hh{font-size:.8rem;color:rgba(244,233,213,.8);letter-spacing:2px;margin-bottom:10px}
.cf{position:relative;width:min(320px,84vw);height:min(240px,62vw);margin:0 auto 8px;border-radius:4px;overflow:hidden;background:rgba(20,10,5,.45);box-shadow:0 0 0 1px rgba(212,175,55,.45),0 0 28px rgba(212,175,55,.2)}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.cov{position:absolute;inset:0;z-index:5;background:rgba(18,10,5,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;opacity:0;pointer-events:none;transition:opacity .6s}
.cov.v{opacity:1;pointer-events:auto}
.cb{padding:11px 36px;cursor:pointer;font-family:'Playfair Display',serif;letter-spacing:3px;color:var(--gold-b);background:rgba(212,175,55,.16);border:1px solid var(--gold)}
.hc{display:flex;justify-content:center;align-items:center;gap:14px;font-size:.85rem;color:var(--gold-b)}
.rb{padding:7px 20px;cursor:pointer;font-size:.78rem;color:var(--gold-b);background:rgba(18,10,5,.5);border:1px solid rgba(212,175,55,.45)}
/* 翻页 */
.next{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);z-index:60;padding:10px 38px;cursor:pointer;font-family:'Playfair Display',serif;font-size:.82rem;letter-spacing:4px;color:var(--gold-b);background:rgba(18,10,5,.5);border:1px solid rgba(212,175,55,.55);transition:all .4s}
.next:hover{background:rgba(212,175,55,.25)}
.next.h{opacity:0;pointer-events:none}
.dots{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:6px;padding:4px 10px;border-radius:10px;background:rgba(18,10,5,.5)}
.pt{width:5px;height:5px;border-radius:50%;background:rgba(212,175,55,.35);cursor:pointer;transition:all .3s}
.pt.a{background:var(--gold-b);width:16px}
</style>
</head>
<body>
<div class="dust" id="dust"></div>
<div id="scenes">
<div class="scene active" id="s0">
    <div class="velvet"></div><div class="veil"></div>
    <svg class="corn tl" viewBox="0 0 52 52"><path d="M2 2 L2 28 Q2 50 26 50 Q50 50 50 28 L50 2Z" fill="none" stroke="#d4af37" stroke-width="1.2"/><path d="M26 4 Q32 13 26 22 Q20 13 26 4Z" fill="#d4af37" opacity=".5"/></svg>
    <svg class="corn tr" viewBox="0 0 52 52"><path d="M2 2 L2 28 Q2 50 26 50 Q50 50 50 28 L50 2Z" fill="none" stroke="#d4af37" stroke-width="1.2"/><path d="M26 4 Q32 13 26 22 Q20 13 26 4Z" fill="#d4af37" opacity=".5"/></svg>
    <svg class="corn bl" viewBox="0 0 52 52"><path d="M2 2 L2 28 Q2 50 26 50 Q50 50 50 28 L50 2Z" fill="none" stroke="#d4af37" stroke-width="1.2"/><path d="M26 4 Q32 13 26 22 Q20 13 26 4Z" fill="#d4af37" opacity=".5"/></svg>
    <svg class="corn br" viewBox="0 0 52 52"><path d="M2 2 L2 28 Q2 50 26 50 Q50 50 50 28 L50 2Z" fill="none" stroke="#d4af37" stroke-width="1.2"/><path d="M26 4 Q32 13 26 22 Q20 13 26 4Z" fill="#d4af37" opacity=".5"/></svg>
    <svg class="angel" viewBox="0 0 180 220"><circle cx="90" cy="70" r="30" fill="rgba(212,175,55,.55)"/><path d="M60 60 Q20 20 10 70 Q40 60 60 70 M120 60 Q160 20 170 70 Q140 60 120 70" fill="rgba(212,175,55,.45)"/><path d="M70 110 Q90 140 110 110 Q90 130 70 110Z" fill="rgba(212,175,55,.4)"/></svg>
    <svg class="angel r" viewBox="0 0 180 220"><circle cx="90" cy="70" r="30" fill="rgba(212,175,55,.55)"/><path d="M60 60 Q20 20 10 70 Q40 60 60 70 M120 60 Q160 20 170 70 Q140 60 120 70" fill="rgba(212,175,55,.45)"/><path d="M70 110 Q90 140 110 110 Q90 130 70 110Z" fill="rgba(212,175,55,.4)"/></svg>
    <svg class="scrollorn" viewBox="0 0 190 190"><path d="M10 180 Q10 60 95 30 Q180 60 180 180" fill="none" stroke="#d4af37" stroke-width="1.4" opacity=".7"/><path d="M40 150 Q40 90 95 70 Q150 90 150 150" fill="none" stroke="#d4af37" stroke-width="1" opacity=".5"/><circle cx="95" cy="30" r="8" fill="none" stroke="#d4af37"/></svg>
    <div class="art">
        <div class="title">My Dearest</div>
        <div class="sub">AN ODE TO ETERNAL LOVE</div>
        <button class="btn" onclick="go(1)">启封情书 ❦</button>
    </div>
</div>

<div class="scene" id="s1">
    <div class="velvet"></div><div class="veil"></div>
    <svg class="angel" viewBox="0 0 180 220"><circle cx="90" cy="70" r="30" fill="rgba(212,175,55,.5)"/><path d="M60 60 Q20 20 10 70 Q40 60 60 70 M120 60 Q160 20 170 70 Q140 60 120 70" fill="rgba(212,175,55,.4)"/></svg>
    <svg class="scrollorn" viewBox="0 0 190 190"><path d="M10 180 Q10 60 95 30 Q180 60 180 180" fill="none" stroke="#d4af37" stroke-width="1.4" opacity=".6"/></svg>
    <div class="art">
        <div class="title">初见</div>
        <div class="body">那一日,金线穿过窗棂,落于你眉间。满室的浮华与喧嚣,都化作你身后的一道剪影。我在人群里望见你,仿佛望见整座宫殿为你点亮灯火。</div>
        <div class="sig">— 于黄昏时分</div>
    </div>
</div>

<div class="scene" id="s2">
    <div class="velvet"></div><div class="veil"></div>
    <div class="art">
        <div class="title">许诺</div>
        <div class="body">岁月如长河,你我皆是渡人。我愿以金为盟,以心为印,在你途经的每一处风景里,立起不灭的灯火。此生此世,风雨同舟,白首不移。</div>
        <div class="sig">— 誓言刻于金箔之上</div>
    </div>
</div>

<div class="scene" id="s3">
    <div class="velvet"></div><div class="veil"></div>
    <svg class="angel" viewBox="0 0 180 220"><circle cx="90" cy="70" r="30" fill="rgba(212,175,55,.5)"/><path d="M70 110 Q90 140 110 110 Q90 130 70 110Z" fill="rgba(212,175,55,.4)"/></svg>
    <div class="hwrap">
        <div class="ht">为爱封缄</div>
        <div class="hh">沿金色轨道,从外至内描摹心形</div>
        <div class="cf"><canvas id="cv"></canvas><div class="cov" id="cov"><div style="font-family:'Pinyon Script';font-size:1.8rem;color:var(--gold-b)">此心已封</div><button class="cb" onclick="go(4)">启 封</button></div></div>
        <div class="hc"><span id="pg">0% ♡</span><button class="rb" id="rb">↺ 重描</button></div>
    </div>
</div>

<div class="scene" id="s4">
    <div class="velvet"></div><div class="veil"></div>
    <div class="art">
        <div class="title">至永恒</div>
        <div class="body">此信不因岁月褪色,此情不因沧海变迁。愿我们的爱,如金箔般淬炼,如星辰般恒久。</div>
    </div>
</div>
</div>
<div class="dots" id="dots"></div>
<button class="next" id="next" onclick="go(cur+1)">NEXT ❦</button>
<script>
const N=5;let cur=0;
function go(i){if(i<0||i>=N)return;cur=i;for(let k=0;k<N;k++){const e=document.getElementById('s'+k);e.classList.toggle('active',k===i)}document.querySelectorAll('.pt').forEach((d,k)=>d.classList.toggle('a',k===i));document.getElementById('next').classList.toggle('h',i===0||i===3||i>=N-1);if(i===3)setTimeout(()=>window.HM&&HM.reset(),350)}
const dd=document.getElementById('dots');for(let i=0;i<N;i++){const d=document.createElement('div');d.className='pt'+(i===0?' a':'');d.onclick=()=>go(i);dd.appendChild(d)}
(function(){const c=document.getElementById('dust');for(let i=0;i<30;i++){const s=document.createElement('div');s.className='d';s.style.left=Math.random()*100+'%';s.style.animationDuration=(8+Math.random()*13)+'s';s.style.animationDelay=(Math.random()*10)+'s';s.style.width=s.style.height=(2+Math.random()*2)+'px';c.appendChild(s)}})();
(function(){'use strict';const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=320,H=240,CX=W/2,CY=H/2-2,OY=5.5,SO=5.0,SM=3.7,SI=2.4,HIT=14,STEP=4,SAM=150,DEN=2000,WT=[.4,.35,.25],UL=.5,CP=.85;const dpr=Math.min(devicePixelRatio||1,3);cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);function hx(t){return 16*Math.pow(Math.sin(t),3)}function hy(t){return 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)}function tc(t,s){return{x:CX+hx(t)*s,y:CY-(hy(t)+OY)*s}}function gen(n,s){const d=[];for(let i=0;i<=DEN;i++){const t=i/DEN*Math.PI*2;d.push({t,x:hx(t),y:hy(t)})}const c=[0];for(let i=1;i<=DEN;i++){const dx=d[i].x-d[i-1].x,dy=d[i].y-d[i-1].y;c.push(c[i-1]+Math.sqrt(dx*dx+dy*dy))}const tot=c[DEN],o=[];for(let i=0;i<n;i++){const tg=i/n*tot;let lo=0,hi=DEN;while(lo<hi){const m=(lo+hi)>>1;if(c[m]<tg)lo=m+1;else hi=m}const p=tc(d[Math.min(lo,DEN)].t,s);o.push({x:p.x,y:p.y,hit:false})}return o}const L=[gen(SAM,SO),gen(SAM,SM),gen(SAM,SI)],hc=[0,0,0],ac=[true,false,false];let st=[],dw=false,last=null,pg=0,done=false,fill=0,pt=[];function calc(){let t=0;for(let i=0;i<3;i++)if(ac[i])t+=WT[i]*(hc[i]/L[i].length);return Math.min(1,t)}function proc(x,y){if(done)return;const ts=HIT*HIT;for(let l=0;l<3;l++){if(!ac[l])continue;for(let i=0;i<L[l].length;i++){if(L[l][i].hit)continue;const dx=L[l][i].x-x,dy=L[l][i].y-y;if(dx*dx+dy*dy<=ts){L[l][i].hit=true;hc[l]++}}}pg=calc();const r0=hc[0]/L[0].length,r1=hc[1]/L[1].length;if(r0>=UL&&!ac[1])ac[1]=true;if(r1>=UL&&!ac[2])ac[2]=true;if(!done&&pg>=CP){done=true}}function seg(x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,ds=Math.sqrt(dx*dx+dy*dy),n=Math.max(1,Math.floor(ds/STEP));for(let i=1;i<=n;i++){const t=i/n;proc(x1+dx*t,y1+dy*t);st.push({x:x1+dx*t,y:y1+dy*t,a:1})}}function add(x,y){if(last)seg(last.x,last.y,x,y);else{proc(x,y);st.push({x,y,a:1})}last={x,y};if(st.length>600)st.splice(0,st.length-600)}function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}function tpos(e){const r=cv.getBoundingClientRect();return{x:(e.touches[0].clientX-r.left)*W/r.width,y:(e.touches[0].clientY-r.top)*H/r.height}}cv.addEventListener('mousedown',e=>{e.preventDefault();dw=true;last=null;const p=pos(e);add(p.x,p.y)});window.addEventListener('mousemove',e=>{if(dw){const p=pos(e);add(p.x,p.y)}});window.addEventListener('mouseup',()=>{dw=false;last=null});cv.addEventListener('touchstart',e=>{e.preventDefault();dw=true;last=null;const p=tpos(e);add(p.x,p.y)},{passive:false});cv.addEventListener('touchmove',e=>{e.preventDefault();if(dw&&e.touches.length){const p=tpos(e);add(p.x,p.y)}},{passive:false});cv.addEventListener('touchend',e=>{e.preventDefault();dw=false;last=null},{passive:false});function path(s){const p=new Path2D();for(let i=0;i<=200;i++){const t=i/200*Math.PI*2,pt=tc(t,s);if(i===0)p.moveTo(pt.x,pt.y);else p.lineTo(pt.x,pt.y)}p.closePath();return p}function sp(){const t=Math.random()*Math.PI*2,s=SO*(.25+Math.random()*.75),a=Math.random()*Math.PI*2,v=.3+Math.random()*1.8;pt.push({x:CX+hx(t)*s,y:CY-(hy(t)+OY)*s,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,decay:.005+Math.random()*.015,size:.8+Math.random()*2.4,color:['#f0d878','#d4af37','#ffe9a0'][Math.floor(Math.random()*3)]})}function render(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(18,10,5,.85)');g.addColorStop(.5,'rgba(42,24,12,.7)');g.addColorStop(1,'rgba(18,10,5,.87)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();ctx.lineCap='round';const TC=[{s:SO,g:14,m:6,c:1.4,a:.16,ca:.35},{s:SM,g:10,m:5,c:1.1,a:.13,ca:.28},{s:SI,g:7,m:3.6,c:.9,a:.11,ca:.22}];for(let i=0;i<3;i++){const t=TC[i],p=path(t.s);ctx.strokeStyle='rgba(212,175,55,.08)';ctx.lineWidth=t.g;ctx.shadowBlur=12;ctx.shadowColor='rgba(212,175,55,.25)';ctx.stroke(p);ctx.shadowBlur=0;ctx.strokeStyle=`rgba(212,175,55,${t.a})`;ctx.lineWidth=t.m;ctx.setLineDash([9,6]);ctx.stroke(p);ctx.setLineDash([]);ctx.strokeStyle=`rgba(240,216,120,${t.ca})`;ctx.lineWidth=t.c;ctx.setLineDash([9,6]);ctx.stroke(p);ctx.setLineDash([])}ctx.restore();for(let i=1;i<st.length;i++){const a=Math.max(0,Math.min(1,st[i].a));if(a<=.01)continue;ctx.beginPath();ctx.moveTo(st[i-1].x,st[i-1].y);ctx.lineTo(st[i].x,st[i].y);ctx.strokeStyle=`rgba(240,216,120,${a})`;ctx.lineWidth=2;ctx.stroke()}if(fill>.01){ctx.save();ctx.globalAlpha=Math.min(1,fill);const fg=ctx.createRadialGradient(CX,CY,8,CX,CY,72);fg.addColorStop(0,'#f0d878');fg.addColorStop(.55,'#d4af37');fg.addColorStop(1,'#7a5a14');ctx.fillStyle=fg;ctx.fill(path(SO));ctx.restore()}for(const p of pt){ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();ctx.restore()}if(!done){ctx.fillStyle='rgba(255,255,255,.15)';ctx.beginPath();ctx.roundRect((W-170)/2,H-24,170,4,2);ctx.fill();if(pg>.01){ctx.fillStyle='#d4af37';ctx.beginPath();ctx.roundRect((W-170)/2,H-24,Math.max(170*pg,3),4,2);ctx.fill()}ctx.fillStyle='rgba(240,216,120,.85)';ctx.font='10px Cormorant Garamond';ctx.textAlign='center';ctx.fillText(Math.round(pg*100)+'%',W/2,H-32);document.getElementById('pg').textContent=Math.round(pg*100)+'% ♡'}}function loop(){for(let i=st.length-1;i>=0;i--){st[i].a-=.02;if(st[i].a<=0)st.splice(i,1)}render();if(done){if(fill<1)fill+=.022;if(fill>=.5&&Math.random()<.5)sp();for(let i=pt.length-1;i>=0;i--){const p=pt[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.01;p.vx*=.996;p.vy*=.996;p.life-=p.decay;if(p.life<=0)pt.splice(i,1)}if(fill>=1)document.getElementById('cov').classList.add('v')}requestAnimationFrame(loop)}function reset(){for(let l=0;l<3;l++){for(const p of L[l])p.hit=false;hc[l]=0}ac[0]=true;ac[1]=false;ac[2]=false;st=[];dw=false;last=null;pg=0;done=false;fill=0;pt=[];document.getElementById('cov').classList.remove('v');document.getElementById('pg').textContent='0% ♡'}document.getElementById('rb').onclick=()=>{if(pg>0&&!confirm('确定重描?'))return;reset()};window.HM={reset};loop()})();
go(0);
</script>
</body>
</html>
